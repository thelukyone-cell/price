<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Печать ценников</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:#eef0f3; color:#1c2430; }
  .toolbar { position:sticky; top:0; z-index:1; background:#fff; border-bottom:1px solid #d9dde3;
             padding:12px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .toolbar input[type=search] { flex:1 1 220px; padding:8px 10px; font-size:15px; border:1px solid #c5ccd5; border-radius:8px; }
  .toolbar select, .toolbar button { padding:8px 12px; font-size:15px; border-radius:8px; border:1px solid #c5ccd5; background:#fff; cursor:pointer; }
  .toolbar button.primary { background:#0a7d4f; color:#fff; border-color:#0a7d4f; }
  .info { color:#6b7684; font-size:13px; width:100%; }
  .err { color:#b3261e; padding:16px; }

  .sheet { display:flex; flex-wrap:wrap; gap:0; padding:16px; }
  .tag { width:var(--w); height:var(--h); border:0.3mm dashed #999; background:#fff; padding:2mm;
         display:flex; gap:2mm; overflow:hidden; cursor:pointer; position:relative; }
  .tag.off { opacity:.25; }
  .tag .txt { flex:1; min-width:0; display:flex; flex-direction:column; }
  .tag .name { font-weight:700; font-size:var(--fs-name); line-height:1.15;
               display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .tag .var { font-size:var(--fs-sub); color:#000; margin-top:0.5mm; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tag .sub { font-size:var(--fs-sub); color:#333; margin-top:1mm; line-height:1.15;
              display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .tag .price { margin-top:auto; font-weight:800; font-size:var(--fs-price); line-height:1; white-space:nowrap; }
  .tag .qr { width:var(--qr); flex:none; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .tag .qr svg { width:var(--qr); height:var(--qr); display:block; }
  .tag .code { font-size:6pt; color:#555; margin-top:0.5mm; }

  .size-s { --w:50mm; --h:30mm; --qr:18mm; --fs-name:7.5pt; --fs-sub:6pt;  --fs-price:13pt; }
  .size-m { --w:58mm; --h:40mm; --qr:22mm; --fs-name:9pt;   --fs-sub:7pt;  --fs-price:17pt; }
  .size-l { --w:70mm; --h:50mm; --qr:26mm; --fs-name:11pt;  --fs-sub:8pt;  --fs-price:22pt; }

  @page { size:A4; margin:8mm; }
  @media print {
    body { background:#fff; }
    .toolbar, .tag.off { display:none !important; }
    .sheet { padding:0; }
    .tag { cursor:default; break-inside:avoid; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <input type="search" id="q" placeholder="Поиск: название, фасовка, ДВ или код">
  <select id="size">
    <option value="size-s">Маленький 50×30 мм</option>
    <option value="size-m" selected>Средний 58×40 мм</option>
    <option value="size-l">Большой 70×50 мм</option>
  </select>
  <button id="all">Выбрать все</button>
  <button id="none">Снять все</button>
  <button class="primary" onclick="window.print()">Печать</button>
  <div class="info" id="info">Загрузка прайса…</div>
</div>
<div class="sheet size-m" id="sheet"></div>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
(async function () {
  const sheet = document.getElementById("sheet"), info = document.getElementById("info");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

  function qrSvg(text) {
    const qr = qrcode(0, "M");
    qr.addData(unescape(encodeURIComponent(text)));   // UTF-8 safe
    qr.make();
    const n = qr.getModuleCount(), m = 1, size = n + m * 2;
    let path = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
      if (qr.isDark(r, c)) path += `M${c + m},${r + m}h1v1h-1z`;
    return `<svg viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${path}" fill="#000"/></svg>`;
  }

  let items;
  try { items = await Price.loadPrice(); }
  catch (e) { info.innerHTML = `<span class="err">${esc(e.message)}</span>`; return; }

  sheet.innerHTML = items.map((it, k) => {
    const variant = [it.form, it.pack].filter(Boolean).join(" · ");
    return `
    <div class="tag" data-k="${k}" data-search="${esc([it.name, it.id, it.dv, it.form, it.pack].join(" ").toLowerCase())}" title="Клик — исключить из печати">
      <div class="txt">
        <div class="name">${esc(it.name)}</div>
        ${variant ? `<div class="var">${esc(variant)}</div>` : ""}
        ${it.dv ? `<div class="sub">ДВ: ${esc(it.dv)}</div>` : ""}
        <div class="price">${esc(Price.formatPrice(it.price))}</div>
      </div>
      <div class="qr">${qrSvg(Price.productUrl(it.id))}<div class="code">${esc(it.id)}</div></div>
    </div>`;
  }).join("");

  const tags = [...sheet.children];
  function updateInfo() {
    const n = tags.filter(t => !t.classList.contains("off") && t.style.display !== "none").length;
    info.innerHTML = `Товаров в прайсе: ${items.length}. К печати: <b>${n}</b>. Клик по ценнику — исключить/вернуть. ` +
      `QR ведут на: ${esc(Price.productUrl(""))}`;
  }

  sheet.addEventListener("click", e => { const t = e.target.closest(".tag"); if (t) { t.classList.toggle("off"); updateInfo(); } });
  document.getElementById("q").addEventListener("input", e => {
    const q = e.target.value.trim().toLowerCase();
    tags.forEach(t => t.style.display = !q || t.dataset.search.includes(q) ? "" : "none");
    updateInfo();
  });
  document.getElementById("size").addEventListener("change", e => { sheet.className = "sheet " + e.target.value; });
  document.getElementById("all").onclick = () => { tags.forEach(t => t.classList.remove("off")); updateInfo(); };
  document.getElementById("none").onclick = () => { tags.forEach(t => t.classList.add("off")); updateInfo(); };
  updateInfo();
})();
</script>
</body>
</html>
