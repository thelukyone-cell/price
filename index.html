<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цена товара</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#1c2430; --muted:#6b7684; --accent:#0a7d4f; --err:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161b; --card:#1c222a; --text:#e8ecf0; --muted:#9aa5b1; --accent:#3ccf8e; --err:#ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display:flex; align-items:center; justify-content:center; padding:16px; }
  .card { background:var(--card); border-radius:20px; padding:28px 24px; width:100%; max-width:440px;
          box-shadow:0 4px 24px rgba(0,0,0,.08); }
  .shop { color:var(--muted); font-size:14px; margin-bottom:16px; }
  h1 { font-size:22px; line-height:1.3; margin:0 0 6px; }
  .variant { color:var(--muted); font-size:16px; margin-bottom:20px; }
  .pnote { color:var(--muted); font-size:14px; margin-top:6px; }
  .label { color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; }
  .substance { font-size:18px; margin-bottom:24px; }
  .price { font-size:48px; font-weight:700; color:var(--accent); line-height:1.1; }
  .note { color:var(--muted); font-size:12px; margin-top:24px; }
  .err { color:var(--err); }
  .loading { color:var(--muted); }
</style>
</head>
<body>
<main class="card" id="app"><div class="loading">Загрузка…</div></main>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
(async function () {
  const app = document.getElementById("app");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const shop = PRICE_CONFIG.SHOP_NAME ? `<div class="shop">${esc(PRICE_CONFIG.SHOP_NAME)}</div>` : "";
  const id = new URLSearchParams(location.search).get("id");

  if (!id) { app.innerHTML = shop + `<div class="err">Отсканируйте QR-код на ценнике.</div>`; return; }

  try {
    const items = await Price.loadPrice();
    const it = items.find(x => x.id === id.trim());
    if (!it) { app.innerHTML = shop + `<div class="err">Товар с кодом «${esc(id)}» не найден в прайсе.</div>`; return; }

    const variant = [it.form, it.pack].filter(Boolean).join(" · ");
    const row = (label, val) => val ? `<div class="label">${label}</div><div class="substance">${esc(val)}</div>` : "";
    document.title = it.name + " — " + Price.formatPrice(it.price);
    app.innerHTML = shop + `
      <h1>${esc(it.name)}</h1>
      ${variant ? `<div class="variant">${esc(variant)}</div>` : ""}
      ${row("Действующее вещество", it.dv)}
      ${row("Назначение", it.pests)}
      <div class="label">Цена</div>
      <div class="price">${esc(Price.formatPrice(it.price))}</div>
      ${it.note ? `<div class="pnote">${esc(it.note)}</div>` : ""}
      <div class="note">Цена актуальна на ${new Date().toLocaleString("ru-RU", { dateStyle:"long", timeStyle:"short" })}</div>`;
  } catch (e) {
    app.innerHTML = shop + `<div class="err">${esc(e.message)}</div>`;
  }
})();
</script>
</body>
</html>
